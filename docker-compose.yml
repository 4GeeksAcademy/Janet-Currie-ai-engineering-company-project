services:
  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    volumes:
      - ./uis/website:/app/uis/website
      - ./uis/web:/app/uis/web
      - ui_root_node_modules:/app/node_modules
      - ui_website_node_modules:/app/uis/website/node_modules
      - ui_web_node_modules:/app/uis/web/node_modules
    networks:
      - healthcore_dev

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./services/api:/app/services/api
      - ./scripts:/app/scripts
      - backend_venv:/app/services/api/.venv
    networks:
      - healthcore_dev

volumes:
  ui_root_node_modules:
  ui_website_node_modules:
  ui_web_node_modules:
  backend_venv:

networks:
  healthcore_dev:
    name: healthcore_dev
