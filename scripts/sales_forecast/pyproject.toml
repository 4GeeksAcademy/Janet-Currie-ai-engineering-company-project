[project]
name = "healthcore-sales-forecast"
version = "0.1.0"
description = "Leakage-safe monthly revenue forecast for HealthCore (feasibility only)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sales_forecast"]

[tool.pytest.ini_options]
testpaths = [
  "../../tests/pipelines/test_sales_forecast_split.py",
  "../../tests/pipelines/test_sales_forecast_features.py",
  "../../tests/pipelines/test_sales_forecast_metrics.py",
]
python_files = ["test_sales_forecast_*.py"]
pythonpath = ["."]
addopts = "-q"
